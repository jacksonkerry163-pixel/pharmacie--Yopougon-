<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacies de Garde - Yopougon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-emerald-600 text-white shadow-md p-4 text-center">
        <h1 class="text-2xl font-bold">Pharmacies de Garde Yopougon</h1>
        <p class="text-sm text-emerald-100 mt-1">Trouvez rapidement une pharmacie de garde près de chez vous</p>
    </header>

    <main class="flex-grow mx-auto p-4 max-w-2xl w-full">
        <!-- Barre de recherche -->
        <div class="mb-4">
            <input type="text" id="searchInput" placeholder="Rechercher par nom ou quartier..." 
                   class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
        </div>

        <!-- Compteur de résultats -->
        <div id="searchCount" class="text-xs text-gray-500 mb-4 px-1"></div>

        <!-- Liste des pharmacies -->
        <div id="pharmaciesList" class="space-y-4">
            <p class="text-center text-gray-500 py-8">Chargement des pharmacies...</p>
        </div>
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500 mt-auto">
        &copy; 2026 - Pharmacies Yopougon &bull; Données en temps réel
    </footer>

    <script>
        const SUPABASE_URL = 'https://bbixpbaeskgsrjawjmpv.supabase.co';
        const SUPABASE_ANON_KEY = '  eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiaXhwYmFlc2tnc3JqYXdqbXB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTk4OTQsImV4cCI6MjEwNDQzNTg5NH0.rnX2zvR4dt-v9chnWFUUTt8qTGojHd7oiID6vQKvyIo   '; // Conservez votre clé actuelle

        const container = document.getElementById('pharmaciesList');
        const searchInput = document.getElementById('searchInput');
        const searchCount = document.getElementById('searchCount');
        let toutesLesPharmacies = [];

        async function chargerPharmacies() {
            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data, error } = await supabase.from('Pharmacies').select('*');
                
                if (error) throw error;
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500">Aucune pharmacie trouvée dans la base de données.</p>';
                    searchCount.textContent = '';
                    return;
                }

                toutesLesPharmacies = data;
                afficherPharmacies(toutesLesPharmacies);

            } catch (err) {
                container.innerHTML = `
                    <div class="bg-red-50 border border-red-200 p-4 rounded-lg text-center text-red-600">
                        <p class="font-bold">Erreur de connexion à Supabase :</p>
                        <p class="text-sm mt-1">${err.message}</p>
                    </div>`;
            }
        }

        // Fonction pour formater joliment le numéro (ex: 2723451122 -> 27 23 45 11 22)
        function formaterTelephone(tel) {
            if (!tel) return '';
            let net = tel.toString().replace(/\s+/g, '');
            if (net.length === 10) {
                return `${net.slice(0,2)} ${net.slice(2,4)} ${net.slice(4,6)} ${net.slice(6,8)} ${net.slice(8,10)}`;
            }
            return tel;
        }

        function afficherPharmacies(pharmacies) {
            // Mise à jour du compteur
            const count = pharmacies.length;
            searchCount.textContent = `${count} pharmacie${count > 1 ? 's' : ''} disponible${count > 1 ? 's' : ''}`;

            if (count === 0) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 text-center">
                        <p class="text-gray-500">Aucune pharmacie ne correspond à votre recherche.</p>
                    </div>`;
                return;
            }

            container.innerHTML = pharmacies.map(p => {
                const nom = p.Nom_pharmacie || 'Pharmacie';
                const quartier = p.Quartier || 'Non spécifié';
                const telephoneBrut = p['Téléphone 1'] || '';
                
                let elementContact = `<p class="text-sm text-gray-500 flex items-center gap-2">📞 Contact : <span class="text-gray-400 italic">Non disponible</span></p>`;
                
                if (telephoneBrut) {
                    const telClean = telephoneBrut.toString().replace(/\s+/g, '');
                    const telJoli = formaterTelephone(telephoneBrut);
                    elementContact = `
                        <p class="text-sm text-gray-700 flex items-center gap-2">
                            <span>📞</span> 
                            <span>Contact :</span>
                            <a href="tel:${telClean}" class="text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200 hover:bg-emerald-100 transition-colors inline-flex items-center gap-1">
                                📱 ${telJoli}
                            </a>
                        </p>`;
                }

                const queryMap = encodeURIComponent(`${nom} ${quartier} Yopougon Abidjan`);
                const lienMaps = `https://www.google.com/maps/search/?api=1&query=${queryMap}`;

                return `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition-shadow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start gap-2">
                                <h3 class="font-bold text-lg text-emerald-800">${nom}</h3>
                                <span class="bg-green-100 text-green-800 text-[10px] font-semibold px-2 py-0.5 rounded-full uppercase tracking-wide">De garde</span>
                            </div>
                            <p class="text-sm text-gray-600 mt-1 flex items-center gap-1.5">
                                <span>📍</span> Quartier : <strong class="text-gray-800">${quartier}</strong>
                            </p>
                            <div class="mt-3">
                                ${elementContact}
                            </div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-gray-100 flex justify-end">
                            <a href="${lienMaps}" target="_blank" class="inline-flex items-center gap-1.5 text-xs bg-emerald-600 text-white font-medium px-3.5 py-2 rounded-lg hover:bg-emerald-700 transition-colors shadow-sm">
                                🗺️ Itinéraire / Maps
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        searchInput.addEventListener('input', (e) => {
            const valeurRecherche = e.target.value.toLowerCase().trim();
            const pharmaciesFiltrees = toutesLesPharmacies.filter(p => {
                const nom = (p.Nom_pharmacie || '').toLowerCase();
                const quartier = (p.Quartier || '').toLowerCase();
                return nom.includes(valeurRecherche) || quartier.includes(valeurRecherche);
            });
            afficherPharmacies(pharmaciesFiltrees);
        });

        chargerPharmacies();
    </script>
</body>
</html>
