<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacies de Garde - Yopougon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-emerald-600 text-white shadow-md p-4 text-center">
        <h1 class="text-2xl font-bold">Pharmacies de Garde Yopougon</h1>
        <p class="text-sm text-emerald-100 mt-1">Trouvez rapidement une pharmacie de garde près de chez vous</p>
    </header>

    <main class="flex-grow mx-auto p-4 max-w-2xl w-full">
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Rechercher par nom ou quartier..." 
                   class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div id="pharmaciesList" class="space-y-4">
            <p class="text-center text-gray-500">Chargement des pharmacies...</p>
        </div>
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        &copy; 2026 - Pharmacies Yopougon
    </footer>

    <script>
        const SUPABASE_URL = 'https://bbixpbaeskgsrjawjmpv.supabase.co';
        const SUPABASE_ANON_KEY = '   eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiaXhwYmFlc2tnc3JqYXdqbXB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTk4OTQsImV4cCI6MjEwNDQzNTg5NH0.rnX2zvR4dt-v9chnWFUUTt8qTGojHd7oiID6vQKvyIo '; // Remplacez ceci par votre vraie clé anon de Supabase

        const container = document.getElementById('pharmaciesList');

        async function chargerPharmacies() {
            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data, error } = await supabase.from('Pharmacies').select('*');
                
                if (error) throw error;
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500">Aucune pharmacie trouvée dans la base de données.</p>';
                    return;
                }

                container.innerHTML = data.map(p => `
                    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-100">
                        <h3 class="font-bold text-lg text-emerald-700">${p.Nom_pharmacie || p.nom || 'Pharmacie'}</h3>
                        <p class="text-sm text-gray-600 mt-1">📍 Quartier : ${p.Quartier || p.quartier || 'Non spécifié'}</p>
                        <p class="text-sm text-gray-600">📞 Contact : ${p.Contact || p.telephone || 'Non disponible'}</p>
                    </div>
                `).join('');

            } catch (err) {
                container.innerHTML = `
                    <div class="bg-red-50 border border-red-200 p-4 rounded-lg text-center text-red-600">
                        <p class="font-bold">Erreur de connexion à Supabase :</p>
                        <p class="text-sm mt-1">${err.message}</p>
                    </div>`;
            }
        }

        chargerPharmacies();
    </script>
</body>
</html>
