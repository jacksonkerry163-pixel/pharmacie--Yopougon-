<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacies de Garde - Yopougon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-emerald-600 text-white shadow-md p-4 text-center">
        <h1 class="text-2xl font-bold">Pharmacies de Garde Yopougon</h1>
        <p class="text-sm text-emerald-100 mt-1">Trouvez rapidement une pharmacie de garde près de chez vous</p>
    </header>

    <main class="flex-grow mx-auto p-4 max-w-2xl w-full">
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Rechercher par nom ou quartier..." 
                   class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div id="pharmaciesList" class="space-y-4">
            <p class="text-center text-gray-500">Chargement des pharmacies...</p>
        </div>
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        &copy; 2026 - Pharmacies Yopougon
    </footer>

    <script>
        const SUPABASE_URL = 'https://bbixpbaeskgsrjawjmpv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiaXhwYmFlc2tnc3JqYXdtdHB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg2MjAsImV4cCI6MjA1NjgxNDYyMH0.eyJjJ3Ijo5MjE2MywiaW5wdWgiLCJ0ciI6InB5cmVpbmVycyIsImFpZCI6IjIwMDkiLCJjcm15MiJ9.eyJuYyI6ImpWJ3I';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function chargerPharmacies() {
            const container = document.getElementById('pharmaciesList');
            try {
                const { data, error } = await supabase
                    .from('Pharmacies')
                    .select('*');

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500">Aucune pharmacie trouvée.</p>';
                    return;
                }

                window.allPharmacies = data;
                afficherPharmacies(data);

            } catch (err) {
                console.error('Erreur :', err);
                container.innerHTML = `<p class="text-center text-red-500 p-4">Erreur : ${err.message}</p>`;
            }
        }

        function afficherPharmacies(list) {
            const container = document.getElementById('pharmaciesList');
            if (list.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500">Aucune pharmacie ne correspond à votre recherche.</p>';
                return;
            }
            container.innerHTML = list.map(p => `
                <div class="bg-white p-4 rounded-lg shadow border border-gray-100">
                    <h3 class="font-bold text-lg text-emerald-700">${p.Nom_pharmacie || p.nom || 'Pharmacie'}</h3>
                    <p class="text-gray-600 text-sm">Quartier : ${p.Quartier || p.quartier || 'Non spécifié'}</p>
                    <p class="text-gray-500 text-xs mt-1">Contact : ${p.Contact || p.contact || 'Non disponible'}</p>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            if (!window.allPharmacies) return;
            const filtered = window.allPharmacies.filter(p => {
                const nom = (p.Nom_pharmacie || p.nom || '').toLowerCase();
                const quartier = (p.Quartier || p.quartier || '').toLowerCase();
                return nom.includes(term) || quartier.includes(term);
            });
            afficherPharmacies(filtered);
        });

        chargerPharmacies();
    </script>
</body>
</html>
