<body class="bg-gray-50 min-h-screen flex flex-col">

<img src="logo-mediflow.png" alt="Logo MEDIFLOW" class="h-10 w-auto max-w-[150px] object-contain">

            <!-- Bouton d'installation PWA -->

                📲 Installer
            </button>
        </div>
    </header>

    <main class="flex-grow mx-auto p-4 max-w-2xl w-full">
        <!-- Numéros d'urgence rapide -->

            <span class="text-gray-600">🚨 Urgences :</span>
            <a href="tel:185" class="hover:underline text-emerald-700">SAMU: 185</a>

        <div class="space-y-3 mb-4 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div>
                <label for="communeSelect" class="block text-xs font-semibold text-gray-600 mb-1">📍 Choisir la Ville / Commune :</label>

                    <option value="Toutes">🌍 Toutes les villes et communes</option>
                </select>
            </div>

            <div>
                <label for="searchInput" class="block text-xs font-semibold text-gray-600 mb-1">🔍 Recherche rapide :</label>
                <input type="text" id="searchInput" placeholder="Rechercher par quartier, pharmacie ou ville (ex: Angré, Niangon, Bardot, Bouaké)..." 
                       class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-sm">
            </div>
        </div>

        <div id="searchCount" class="text-xs text-gray-500 mb-3 px-1 font-semibold"></div>

        <div id="pharmaciesList" class="space-y-3">
            <p class="text-center text-gray-500 py-8">Chargement des pharmacies...</p>
        </div>
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500 mt-auto">
        &copy; 2026 - Pharmacies de Garde CI &bull; Service d'Urgence Côte d'Ivoire

            // --- AUTRES VILLES ---
            { Nom_pharmacie: "Pharmacie de l'Indénié", Quartier: "Indénié", Commune: "Abengourou", "Téléphone 1": "2735913604" },
            { Nom_pharmacie: "Pharmacie de la Paix", Quartier: "Babre", Commune: "Gagnoa", "Téléphone 1": "2732771540" },
            { Nom_pharmacie: "Pharmacie des 18 Montagnes", Quartier: "Commerce", Commune: "Man", "Téléphone 1": "2733791020" },
            { Nom_pharmacie: "Pharmacie de Bassam", Quartier: "Quartier France", Commune: "Grand-Bassam", "Téléphone 1": "2721301020" },
            { Nom_pharmacie: "Pharmacie du Léboutou", Quartier: "Commerce", Commune: "Dabou", "Téléphone 1": "2723571020" },
            { Nom_pharmacie: "Pharmacie de Soubré", Quartier: "Naio", Commune: "Soubré", "Téléphone 1": "2734721020" },
            { Nom_pharmacie: "Pharmacie du Zanzan", Quartier: "Commerce", Commune: "Bondoukou", "Téléphone 1": "2735921030" },
            { Nom_pharmacie: "Pharmacie du Lôh-Djiboua", Quartier: "Bada", Commune: "Divo", "Téléphone 1": "2732761010" },
            { Nom_pharmacie: "Pharmacie d'Agboville", Quartier: "Résidentiel", Commune: "Agboville", "Téléphone 1": "2723541010" }
        ];

        let pharmaciesAffichees = [...BASE_PHARMACIES];
        let deferredPrompt = null;

        const container = document.getElementById('pharmaciesList');
        const searchInput = document.getElementById('searchInput');
        const communeSelect = document.getElementById('communeSelect');
        const searchCount = document.getElementById('searchCount');
        const pwaBtn = document.getElementById('pwaInstallBtn');

        // Capture de l'événement d'installation PWA
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaBtn.classList.remove('hidden');
        });

        function installerPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        pwaBtn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }

        function normaliserTexte(str) {
            return (str || '')
                .toString()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim();
        }

        function remplirMenuCommunes(pharmacies) {
            const communesSet = new Set();
            pharmacies.forEach(p => {
                const zone = p.Commune || p.commune || p.Ville || p.ville || '';
                if (zone.toString().trim()) {
                    const zonePropre = zone.toString().trim();
                    const zoneFormatee = zonePropre.charAt(0).toUpperCase() + zonePropre.slice(1);
                    communesSet.add(zoneFormatee);
                }
            });

            const communesTriees = Array.from(communesSet).sort((a, b) => a.localeCompare(b, 'fr'));
            communeSelect.innerHTML = '<option value="Toutes">🌍 Toutes les villes et communes</option>';
            communesTriees.forEach(commune => {
                const opt = document.createElement('option');
                opt.value = commune;
                opt.textContent = commune;
                communeSelect.appendChild(opt);
            });
        }

        function formaterTelephone(tel) {
            if (!tel) return '';
            let net = tel.toString().replace(/\s+/g, '');
            if (net.length === 10) {
                return `${net.slice(0,2)} ${net.slice(2,4)} ${net.slice(4,6)} ${net.slice(6,8)} ${net.slice(8,10)}`;
            }
            return tel;
        }

        function filtrerEtAfficher() {
            const zoneChoisie = communeSelect.value;
            const valeurRecherche = normaliserTexte(searchInput.value);

            const pharmaciesFiltrees = pharmaciesAffichees.filter(p => {
                const zonePharmacie = normaliserTexte(p.Commune || p.commune || p.Ville || p.ville || '');
                const matchZone = (zoneChoisie === 'Toutes' || zonePharmacie === normaliserTexte(zoneChoisie));

                let matchTexte = true;
                if (valeurRecherche) {
                    const texteGlobal = normaliserTexte(Object.values(p).join(' '));
                    matchTexte = texteGlobal.includes(valeurRecherche);
                }

                return matchZone && matchTexte;
            });

            afficherPharmacies(pharmaciesFiltrees);
        }

        function afficherPharmacies(pharmacies) {
            const count = pharmacies.length;
            searchCount.textContent = `${count} pharmacie${count > 1 ? 's' : ''} disponible${count > 1 ? 's' : ''}`;

            if (count === 0) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 text-center">
                        <p class="text-gray-500 font-medium">Aucune pharmacie trouvée pour cette recherche.</p>
                    </div>`;
                return;
            }

            container.innerHTML = pharmacies.map(p => {
                const nom = p.Nom_pharmacie || p.nom_pharmacie || p.Nom || p.nom || 'Pharmacie';
                const zone = p.Commune || p.commune || p.Ville || p.ville || 'Côte d\'Ivoire';
                const quartier = p.Quartier || p.quartier || 'Centre';
                const telephoneBrut = p['Téléphone 1'] || p['telephone 1'] || p['Telephone'] || p['Téléphone'] || p['Tel'] || p['tel'] || '';
                
                let elementContact = `<p class="text-xs text-gray-400 italic">📞 Contact non disponible</p>`;
                if (telephoneBrut) {
                    const telClean = telephoneBrut.toString().replace(/\s+/g, '');
                    const telJoli = formaterTelephone(telephoneBrut);
                    elementContact = `
                        <a href="tel:${telClean}" class="text-emerald-700 font-bold bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200 hover:bg-emerald-100 transition-colors inline-flex items-center gap-1.5 text-xs">
                            📱 ${telJoli}
                        </a>`;
                }

                const queryMap = encodeURIComponent(`${nom} ${quartier} ${zone} Côte d'Ivoire`);
                const lienMaps = `https://www.google.com/maps/search/?api=1&query=${queryMap}`;

                return `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition-all flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start gap-2">
                                <h3 class="font-bold text-base text-emerald-900 leading-snug">${nom}</h3>
                                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">De garde</span>
                            </div>
                            <p class="text-xs font-bold text-emerald-600 mt-1 uppercase">📍 ${zone} - ${quartier}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center gap-2">
                            <div>${elementContact}</div>
                            <a href="${lienMaps}" target="_blank" class="inline-flex items-center gap-1 text-xs bg-emerald-600 text-white font-semibold px-3 py-1.5 rounded-lg hover:bg-emerald-700 transition-colors shadow-sm">
                                🗺️ Itinéraire
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Initialisation instantanée
        remplirMenuCommunes(pharmaciesAffichees);
        filtrerEtAfficher();

        searchInput.addEventListener('input', filtrerEtAfficher);
        communeSelect.addEventListener('change', filtrerEtAfficher);
    </script>  
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('MEDIFLOW : service worker activé'))
        .catch(error => console.error('Erreur service worker :', error));
    });
  }
    </script>
</body>
