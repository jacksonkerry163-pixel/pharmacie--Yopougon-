<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacies de Garde - Yopougon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- En-tête -->
    <header class="bg-emerald-600 text-white shadow-md p-4 text-center">
        <h1 class="text-2xl font-bold">Pharmacies de Garde Yopougon</h1>
        <p class="text-sm text-emerald-100 mt-1">Trouvez rapidement une pharmacie de garde près de chez vous</p>
    </header>

    <!-- Contenu Principal -->
    <main class="flex-grow container mx-auto p-4 max-w-2xl">
        <!-- Barre de recherche -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Rechercher par nom ou quartier..." 
                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <!-- Liste des pharmacies -->
        <div id="pharmaciesList" class="space-y-4">
            <p class="text-center text-gray-500">Chargement des pharmacies...</p>
        </div>
    </main>

    <!-- Pied de page -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        &copy; 2026 - Yopougon Pharmacies
    </footer>

    <!-- Script de connexion Supabase et affichage -->
    <script>
        // Remplacez ces valeurs par vos identifiants Supabase si nécessaire
        const SUPABASE_URL = 'VOTRE_SUPABASE_URL';
        const SUPABASE_KEY = 'VOTRE_SUPABASE_ANON_KEY';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadPharmacies() {
            const container = document.getElementById('pharmaciesList');
            try {
                const { data, error } = await supabaseClient
                    .from('Pharmacies')
                    .select('*');

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500">Aucune pharmacie enregistrée pour le moment.</p>';
                    return;
                }

                displayPharmacies(data);

                // Gestion de la recherche
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = data.dataFromSupabase ? data : data.filter(p => 
                        (p.nom && p.nom.toLowerCase().includes(term)) || 
                        (p.quartier && p.quartier.toLowerCase().includes(term))
                    );
                    displayPharmacies(filtered);
                });

            } catch (err) {
                console.error('Erreur:', err);
                container.innerHTML = '<p class="text-center text-red-500">Erreur lors du chargement des données.</p>';
            }
        }

        function displayPharmacies(list) {
            const container = document.getElementById('pharmaciesList');
            container.innerHTML = list.map(p => `
                <div class="bg-white p-4 rounded-lg shadow border-l-4 border-emerald-500">
                    <h2 class="text-lg font-semibold text-gray-800">${p.nom || 'Nom indisponible'}</h2>
                    <p class="text-sm text-gray-600 mt-1">📍 Quartier : ${p.quartier || 'Non spécifié'}</p>
                    <p class="text-sm text-gray-600 mt-1">📞 Contact : ${p.contact || 'Non disponible'}</p>
                </div>
            `).join('');
        }

        loadPharmacies();
    </script>
</body>
</html>
